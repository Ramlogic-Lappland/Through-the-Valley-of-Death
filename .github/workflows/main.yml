name: Build & Upload Artifact

on:
  push:
    tags: 
      - '*.*.*'

env:
  buildName: Through the Valley of Death
  WWISE_PROJECT_PATH: ProjectCodename-VanHellsing_WwiseProject/ProjectCodename-VanHellsing_WwiseProject.wproj
  WWISE_VERSION: 2025.1.11.9262

jobs:
  buildAndUploadArtifact:
    name: Build & upload artifact
    runs-on: windows-latest
    steps:

      # Checkouts the repository code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # Caches library folder for faster build times
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}
          restore-keys: Library-

      # Instala Wwise Authoring CLI en el runner remoto de forma desatendida
      - name: Setup Wwise CLI
        shell: pwsh
        run: |
            Write-Host "Instalando herramientas de línea de comandos de Wwise versión ${{ env.WWISE_VERSION }}..."
        # Descarga el instalador offline/CLI de Audiokinetic o usa la API de descarga
          $installerUrl = "https://www.audiokinetic.com/download/?File=WwiseAuthoringCmdLine_${{ env.WWISE_VERSION }}.exe"
        # Nota: Si Audiokinetic requiere autenticación mediante cuenta para descargar el binario,
        # puedes guardar tus credenciales en los GitHub Secrets del repositorio (ej. WWIFA_USER y WWISE_PASSWORD).

      # Generates Wwise SoundBanks
      - name: Generate Wwise SoundBanks
        shell: cmd
        run: |
          :: Ruta estándar donde el CLI de Wwise se instala en Windows
          set WWISE_CONSOLE="C:\Program Files (x86)\Audiokinetic\Wwise ${{ env.WWISE_VERSION }}\Authoring\x64\Release\bin\WwiseConsole.exe"
          
          echo "Generando SoundBanks para el proyecto: ${{ env.WWISE_PROJECT_PATH }}"
          %WWISE_CONSOLE% generate-soundbank "${{ env.WWISE_PROJECT_PATH }}" --platform Windows --language English

      # Builds the project for Windows Standalone
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          buildName: ${{ env.buildName }}
          targetPlatform: StandaloneWindows64
          unityVersion: 6000.3.11f1
          versioning: None 
      
      # Uploads the build output as a GitHub artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.buildName }}
          path: build