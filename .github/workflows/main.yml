name: Build & Upload Artifact

on:
  push:
    tags: 
      - '*.*.*'

env:
  buildName: Through the Valley of Death
  itchio_channel: windows

jobs:
  buildAndUploadArtifact:
    name: Build & upload artifact
    runs-on: windows-latest
    steps:

      # Checkouts the repository code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # Caches library folder for faster build times
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}
          restore-keys: Library-

      # Builds the project for Windows Standalone
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          buildName: ${{ env.buildName }}
          targetPlatform: StandaloneWindows64
          unityVersion: 6000.3.11f1
          versioning: None 
      
      # Uploads the build output as a GitHub artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.buildName }}
          path: build


  # Deploys the existing build to itch.io
  deployToStore:
        name: Deploy to store
        runs-on: ubuntu-latest
        needs: buildAndUploadArtifact
        steps:

          # Downloads the artifact generated by the build job
          - name: Download Build Artifact
            uses: actions/download-artifact@v4
            with:
              name: ${{ env.buildName }}
              path: build

          # Deploys to Itch.io
          - name: Upload Build to itch.io
            uses: robpc/itchio-upload-action@v1
            with:
              path: build/StandaloneWindows64
              project: ${{ secrets.ITCHIO_PROJECT }}
              channel: ${{ env.itchio_channel }}
              version: ${{ github.ref_name }}
              api-key: ${{ secrets.ITCHIO_API_KEY }}